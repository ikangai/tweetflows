[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "tweetflows"
version = "0.1.0"
description = "Budget-aware planning for agent coordination experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
agentflow = "tweetflows.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tweetflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
